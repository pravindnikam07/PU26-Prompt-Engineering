<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNow - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <a href="index.html">ShopNow</a>
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="signin.html">Sign In</a>
            <a href="signup.html">Sign Up</a>
        </nav>

    </header>


    <!-- Sign In Form -->
    <main class="form-section">

        <div class="form-container">

            <h1>Sign In</h1>

            <p class="form-description">
                Login to your ShopNow account.
            </p>


            <form>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="form-button">
                    Sign In
                </button>

            </form>


            <p class="account-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div>
            <h3>ShopNow</h3>
            <p>Your simple online shopping destination.</p>
        </div>

        <div>
            <h3>Quick Links</h3>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>

        <div>
            <h3>Account</h3>
            <a href="signin.html">Sign In</a>
            <a href="signup.html">Sign Up</a>
        </div>

    </footer>

</body>
</html>
