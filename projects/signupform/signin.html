<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Sign In</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .signin-container {
        width: 400px;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      .signin-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
      }

      .form-group input:focus {
        outline: none;
        border-color: #007bff;
      }

      .signin-btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .signin-btn:hover {
        background-color: #0056b3;
      }

      .forgot-password {
        display: block;
        text-align: right;
        margin-bottom: 20px;
        color: #007bff;
        text-decoration: none;
        font-size: 14px;
      }

      .forgot-password:hover {
        text-decoration: underline;
      }

      .signup-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #555;
      }

      .signup-link a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }

      .signup-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="signin-container">
      <h2>Sign In</h2>

      <form action="/signin" method="POST">
        <div class="form-group">
          <label for="username">Username or Email</label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username or email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <a href="/forgot-password" class="forgot-password">
          Forgot Password?
        </a>

        <button type="submit" class="signin-btn">Sign In</button>

        <div class="signup-link">
          Don't have an account?
          <a href="/signup">Create Account</a>
        </div>
      </form>
    </div>
  </body>
</html>
