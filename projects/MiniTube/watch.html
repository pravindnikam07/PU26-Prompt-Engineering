<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Watch Video - MiniTube</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/watch.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="header">
      <div class="header-left">
        <button id="menuButton" class="icon-button">☰</button>

        <a href="index.html" class="logo">
          <span class="logo-icon"> ▶ </span>

          <span> MiniTube </span>
        </a>
      </div>

      <!-- SEARCH -->

      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search videos..." />

        <button id="searchButton">🔍</button>
      </div>

      <div class="header-right">
        <button class="icon-button">🎥</button>

        <button class="icon-button">🔔</button>

        <button id="themeButton" class="icon-button">🌙</button>

        <div class="profile">U</div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <div class="watch-layout">
      <!-- ================= VIDEO SECTION ================= -->

      <main class="watch-main">
        <!-- VIDEO PLAYER -->

        <div class="player-container">
          <iframe
            id="videoPlayer"
            src=""
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer;
                           autoplay;
                           clipboard-write;
                           encrypted-media;
                           gyroscope;
                           picture-in-picture;
                           web-share"
            allowfullscreen
          >
          </iframe>
        </div>

        <!-- VIDEO INFORMATION -->

        <section class="video-information">
          <h1 id="videoTitle">Loading video...</h1>

          <div class="video-actions">
            <div id="channelInfo" class="channel-info">
              <div id="channelAvatar" class="large-avatar">YT</div>

              <div>
                <h3 id="channelName">Loading...</h3>

                <p id="subscriberCount">YouTube Channel</p>
              </div>
            </div>

            <div class="action-buttons">
              <button id="likeButton" class="action-button">
                👍
                <span> Like </span>
              </button>

              <button id="shareButton" class="action-button">
                ↗
                <span> Share </span>
              </button>

              <button id="saveButton" class="action-button">
                ⏰
                <span> Save </span>
              </button>
            </div>
          </div>

          <!-- DESCRIPTION -->

          <div class="description-box">
            <div class="video-stats">
              <span id="videoDate"> Published </span>
            </div>

            <p id="videoDescription">Loading description...</p>

            <button id="descriptionButton" class="description-button">
              Show more
            </button>
          </div>

          <!-- COMMENTS -->

          <section class="comments-section">
            <h2>Comments</h2>

            <div class="comment-input">
              <div class="comment-avatar">U</div>

              <input type="text" placeholder="Add a comment..." />
            </div>

            <div class="comment">
              <div class="comment-avatar">A</div>

              <div>
                <strong> Alex </strong>

                <p>Great video! 👍</p>
              </div>
            </div>

            <div class="comment">
              <div class="comment-avatar">R</div>

              <div>
                <strong> Rahul </strong>

                <p>Very useful explanation.</p>
              </div>
            </div>
          </section>
        </section>
      </main>

      <!-- ================= RELATED VIDEOS ================= -->

      <aside class="related-section">
        <h2>Related Videos</h2>

        <div id="relatedVideos">
          <!-- Related videos generated by JS -->
        </div>
      </aside>
    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/config.js"></script>

    <script src="js/watch.js"></script>
  </body>
</html>
